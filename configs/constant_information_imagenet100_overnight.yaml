  stage_to_shared_memory: true
  image_size: 256
  num_classes: 100
  epochs: 45
  micro_batch_size: 64
  gradient_accumulation_steps: 8
  workers: 16
  prefetch_factor: 4
  model_dim: 384
  depth: 8
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
  attention_dropout: 0.0
