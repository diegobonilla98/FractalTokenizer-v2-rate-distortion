  maximum_tokens: 160
  universal_mass_per_token: 9926.331293741861
  mass_calibration_images: 2048
  mass_calibration_target_tokens: 96.0
  mass_validation_images: 5000
  partition_stride: 8
  tile_size: 8
  basis_size: 4
  learning_rate: 0.0005
  minimum_learning_rate: 0.000001
  weight_decay: 0.05
  warmup_epochs: 5
  label_smoothing: 0.1
  mixup_alpha: 0.0
  gradient_clip_norm: 1.0
