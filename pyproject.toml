[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractaltokenizer-v2"
version = "0.4.0"
description = "Constant-information adaptive image tokenization and detokenization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.8"]
interactive = [
    "gradio>=6.0",
    "matplotlib>=3.8",
    "opencv-python>=4.10",
    "pycocotools>=2.0.7",
    "scikit-image>=0.24",
    "scipy>=1.14",
]
legacy = ["numba>=0.59"]
test = ["pytest>=8.0"]
train = ["matplotlib>=3.8", "pyarrow>=17.0", "tensorboard>=2.17"]
constant-information = ["matplotlib>=3.8", "scikit-image>=0.24", "scipy>=1.14"]

[tool.setuptools.packages.find]
include = ["fractaltokenizer_v2*", "fractaltokenizer_v3*"]

[tool.setuptools.package-data]
fractaltokenizer_v2 = ["csrc/*.cpp", "csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
